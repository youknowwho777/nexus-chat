<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus Chat</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Segoe UI,sans-serif;
    background-image:url("chat-background.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    color:white;
    overflow:hidden; 
    position:relative;  /* if not relative overlay positioning breaks*/
}
/* Dark overlay on Background  */
body::before{
    content:"";
    position:absolute;
    inset:0;  /*top,bottom,left,right : all 0 (covers entire page)*/
    background:rgba(3,8,20, 0.55);
    z-index:-1; /*pushes overlay behind content and over image*/
}

.chat-page{
    min-height:100vh;
    height:100dvh; 
    display:flex;
    flex-direction:column;
}

.chat-navbar{
    min-height:72px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:18px;
    padding:0 clamp(14px, 3vw, 25px); /*side spaces top=bottom=0*/
    background:rgba(5,15,35,0.55); /*glass like background*/
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo-section{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0; /*text overflow control during size shrinking*/
}

.logo-section img{
    width:clamp(44px, 6vw, 52px);
    aspect-ratio:1;
    border-radius:50%;
    object-fit:cover;
    transition:0.3s;
}

.logo-section img:hover{
    transform:scale(1.2);
}

.logo-section h2{
    font-size:clamp(1.05rem, 3vw, 1.4rem);
    font-weight:600;
    white-space:nowrap;
}

.settings-link{
    width:45px;
    height:45px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    cursor:pointer;
    transition:0.3s;
    text-decoration:none;
    color:white;
    font-size:22px;
    flex-shrink:0;
}

.settings-link:hover{
    background:rgba(255,255,255,0.15);
    transform:rotate(60deg);
}

.chat-content{
    flex:1;
    display:flex;
    min-height:0;
    overflow:hidden;
}

.sidebar{
    width:clamp(280px, 32vw, 360px);
    background:rgba(8,18,40,0.45);
    backdrop-filter:blur(18px);
    border-right:1px solid rgba(255,255,255,0.08);
    display:flex;
    flex-direction:column;
    padding:clamp(12px, 2vw, 16px);
    min-width:0;
}

.search-box{
    margin-bottom:15px;
}

.search-box input{
    width:100%;
    padding:12px 15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:0.95rem;
}

.search-box input::placeholder{
    color:#bfc6d8;
}

/* Chat List */

.chat-list{
    flex:1; /*below search remaining sidebar taken by the list */
    overflow-y:auto;
    min-height:0;
}

/*Custom Scrollbar */
.chat-list::-webkit-scrollbar{ 
    width:6px;
}
.chat-list::-webkit-scrollbar-thumb{
    background:#4d8cff;
    border-radius:20px;
}


.chat-card{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    margin-bottom:8px;
    border-radius:14px;
    cursor:pointer;
    transition:0.3s;
    min-width:0;
}

.chat-card:hover{
    background:rgba(255,255,255,0.08);
    transform:translateX(3px);
}

.chat-card.active{
    background:rgba(77,140,255,0.22);
}

.chat-card.hidden{
    display:none;
}

.profile-pic{
    width:50px;
    aspect-ratio:1;
    border-radius:50%;
    background:linear-gradient(
        135deg,
        #4da3ff,
        #8a5cff
    );
    flex-shrink:0;
}

.chat-info{
    min-width:0;
}

.chat-info h4{
    margin-bottom:4px;
    font-size:1rem;
    
    /*make long text into continueing test like hi....*/
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.chat-info p{
    font-size:0.85rem;
    color:#c2c9d9;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.chat-area{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:clamp(22px, 4vw, 40px);
    min-width:0;
}

.welcome-box{
    margin:auto;
    max-width:600px;
    text-align:center;
}

.welcome-box h1{
    font-size:clamp(2rem, 5vw, 3rem);
    margin-bottom:15px;
}

.welcome-box p{
    font-size:clamp(0.95rem, 2vw, 1.1rem);
    color:#d2d8e5;
    margin-bottom:10px;
}

.conversation{
    width:100%;
    height:100%;
    display:none;
    flex-direction:column;
    min-height:0;
}

.conversation.active{
    display:flex;
}

.chat-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding-bottom:16px;
    border-bottom:1px solid rgba(255,255,255,0.10);
}

.back-to-list{
    display:none;  /*back to list is only for Mobile version*/
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:18px;
    cursor:pointer;
}

.chat-title{
    text-align:left;
    min-width:0;
}

.chat-title h3{
    font-size:1.1rem;
    margin-bottom:3px;
}

.chat-title p{
    color:#c2c9d9;
    font-size:0.85rem;
}

.message-list{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow-y:auto;
    padding:18px 0;
}

.message{
    max-width:min(75%, 520px);
    padding:12px 14px;
    border-radius:14px;
    line-height:1.4;
    text-align:left;
}

.message.received{
    align-self:flex-start; /*moves to left side */
    background:rgba(255,255,255,0.10);
}

.message.sent{
    align-self:flex-end;/*moves to right side */
    background:#2563eb;
}

.message-form{
    display:flex;
    gap:10px;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,0.10);
}

.message-form input{
    flex:1;
    min-width:0;
    padding:13px 15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:0.95rem;
}

.message-form input::placeholder{
    color:#bfc6d8;
}

.message-form button{
    width:48px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.message-form button:disabled{
    cursor:not-allowed;
    opacity:0.75;
}

@media(max-width:900px){

    .sidebar{
        width:45%;  /*increase chat area as Total size decreases*/
        min-width:260px;
    }

    .welcome-box{
        max-width:420px;
    }
}

@media(max-width:700px){

    body{
        overflow:auto;
    }

    .chat-page{
        height:auto;
        min-height:100dvh;
    }

    .chat-navbar{
        min-height:68px;
    }

    .chat-content{
        display:block; /*flex(side by  side) to block(up and down)  */
        overflow:visible;
    }

    .sidebar{
        width:100%;
        min-width:0;
        min-height:calc(100dvh - 68px);
        border-right:none;
    }

    .chat-area{
        display:none;/*hide chat area laptop style*/
    }

    .chat-content.chat-open .sidebar{
        display:none;  /*hide sidebar when caht is opened*/
    }

    .chat-content.chat-open .chat-area{
        display:flex;
        min-height:calc(100dvh - 68px);
    }

    .back-to-list{
        display:flex;
        justify-content:center;
        align-items:center;
        flex-shrink:0;
    }
}

@media(max-width:380px){

    .logo-section{
        gap:8px;
    }

    .settings-link{
        width:40px;
        height:40px;
        font-size:19px;
    }

    .chat-card{
        padding:10px;
    }

    .profile-pic{
        width:44px;
    }
}
</style>
</head>

<body>
<div class="chat-page">
    <header class="chat-navbar">
        <div class="logo-section">
            <img src="chat-logo.png" alt="Nexus Chat Logo">
            <h2>Nexus Chat</h2>
        </div>

        <a href="settings-page.html" class="settings-link">
            <i class="fa-solid fa-gear"></i>
        </a>
    </header>
    <div class="chat-content">
        <aside class="sidebar">
            <div class="search-box">
                <input id="chat-search"
                    type="text"
                    placeholder="Search chats..."
                >
            </div>
            <div class="chat-list">
                <div class="chat-card" data-name="Max" data-preview="Hello Bro...">
                    <div class="profile-pic"></div>
                    <div class="chat-info">
                        <h4>Max</h4>
                        <p>Hello Bro...</p>
                    </div>
                </div>
                <div class="chat-card" data-name="Rishi" data-preview="How are you?">
                    <div class="profile-pic"></div>
                    <div class="chat-info">
                        <h4>Rishi</h4>
                        <p>How are you?</p>
                    </div>
                </div>
                <div class="chat-card" data-name="Adharana" data-preview="PDF Sent">
                    <div class="profile-pic"></div>
                    <div class="chat-info">
                        <h4>Adharana</h4>
                        <p>PDF Sent</p>
                    </div>
                </div>
                <div class="chat-card" data-name="Siddu" data-preview="Welcome to Nexus Chat!">
                    <div class="profile-pic"></div>
                    <div class="chat-info">
                        <h4>Siddu (You)</h4>
                        <p>Welcome to Nexus Chat!</p>
                    </div>
                </div>
            </div>
        </aside>
        <main class="chat-area">
            <div class="welcome-box" id="welcome-box">
                <h1>Welcome to Nexus Chat</h1>
                <p>Connect Beyond Boundaries</p>
                <p>Select a friend and start chatting.</p>
            </div>
            <div class="conversation" id="conversation">
                <div class="chat-header">
                    <!--For Mobile Screens Design-->
                    <button class="back-to-list" id="back-to-list" type="button">  
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="profile-pic"></div>
                    <div class="chat-title">
                        <h3 id="chat-name">Friend</h3>
                        <p id="chat-status">Online</p>
                    </div>
                </div>
                <div class="message-list" id="message-list"></div>  <!-- JS dynamically uses this to store chat sent and received -->
                <form class="message-form" id="message-form">
                    <input
                        type="text" 
                        id="message-input"
                        placeholder="Type a message..."
                        autocomplete="off"
                    >
                    <button type="submit">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </main>
    </div>
</div>

<script type="module" src="chat-page.js"></script>
</body>
</html>
